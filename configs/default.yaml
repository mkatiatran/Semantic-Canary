data:
  hf_dataset: ziadatalabs/FreeInsuranceClaims100M
  sample_rows: 100000
  seed: 42

target: is_fraud_flagged_ground_truth

features:
  categorical:
    - claim_type
    - state
  numeric:
    - policyholder_tenure_years
    - previous_claims_count
    - claim_amount
    - deductible
    - days_between_incident_and_filing

excluded:
  - claim_id
  - policy_id
  - incident_date
  - claim_filed_date
  - claim_status
  - days_to_resolution
  - is_fraud_flagged_ground_truth

monitoring:
  psi_threshold: 0.20
  ks_pvalue_threshold: 0.01
  relation_z_threshold: 4.0
  counterfactual_rate_threshold: 0.90
  bins: 10
